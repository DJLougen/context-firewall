[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "context-firewall"
version = "0.1.0"
description = "CPU-only inline context compression for agent harnesses"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "DJLougen"}]
dependencies = [
    "scikit-learn>=1.4",
    "joblib>=1.4",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
cf-train = "context_firewall.cli_train:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["context_firewall*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
