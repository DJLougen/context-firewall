[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "honey-comb"
version = "0.3.0"
description = "CPU-only inline context compression for agent harnesses — keep the honey, drop the wax"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "DJLougen"}]
dependencies = [
    "scikit-learn>=1.4",
    "joblib>=1.4",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
honeycomb-train = "honeycomb.cli_train:main"
honeycomb-gain = "honeycomb.gain:_cli_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["honeycomb*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
